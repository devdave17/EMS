
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS | Redirecting...</title>

    <script>
        (() => {
            const LOGIN_PATH = "/auth/login";

            const DASHBOARD_PATHS = {
                STUDENT: "/auth/student/dashboard",
                TEACHER: "/auth/teacher/dashboard",
                ADMIN: "/auth/admin/dashboard"
            };

            try {
                const token = localStorage.getItem("token");
                const storedUser = localStorage.getItem("ems_current_user");

                if (!token || !storedUser) {
                    window.location.replace(LOGIN_PATH);
                    return;
                }

                const user = JSON.parse(storedUser);
                const role = String(user?.role ?? "").toUpperCase();
                const dashboardPath = DASHBOARD_PATHS[role];

                if (!dashboardPath) {
                    localStorage.removeItem("token");
                    localStorage.removeItem("ems_current_user");

                    window.location.replace(LOGIN_PATH);
                    return;
                }

                window.location.replace(dashboardPath);

            } catch (error) {
                console.error("Unable to restore EMS session:", error);

                try {
                    localStorage.removeItem("token");
                    localStorage.removeItem("ems_current_user");
                } catch (_) {
                    // Storage may be unavailable.
                }

                window.location.replace(LOGIN_PATH);
            }
        })();
    </script>
</head>
<body>
<p>Redirecting to EMS...</p>
</body>
</html>
