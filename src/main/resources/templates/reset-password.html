```html
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | EMS</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
<main class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <!-- Header -->
    <div class="text-center mb-8">
        <img
                class="mx-auto mb-4 h-20 w-20 rounded-xl object-contain"
                src="/EMSlogo.png"
                alt="EMS logo"
        />

        <h1 class="text-2xl font-bold text-slate-800">Reset Password</h1>

        <p class="mt-2 text-sm text-slate-500">
            Create a new password for your EMS account.
        </p>
    </div>

    <!-- Reset Form -->
    <form id="reset-form" class="space-y-5">
        <div>
            <label
                    for="new-password"
                    class="mb-2 block text-sm font-medium text-slate-700"
            >
                New Password
            </label>

            <input
                    id="new-password"
                    name="newPassword"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
        </div>

        <div>
            <label
                    for="confirm-password"
                    class="mb-2 block text-sm font-medium text-slate-700"
            >
                Confirm Password
            </label>

            <input
                    id="confirm-password"
                    name="confirmPassword"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Re-enter new password"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
        </div>

        <p class="text-xs text-slate-500">
            Password must contain at least 8 characters.
        </p>

        <!-- Status Message -->
        <div
                id="message"
                class="hidden rounded-lg p-3 text-sm"
                role="status"
                aria-live="polite"
        ></div>

        <button
                id="submit-btn"
                type="submit"
                class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >
            Update Password
        </button>
    </form>

    <div class="mt-6 text-center">
        <a
                href="/auth/login"
                class="text-sm font-medium text-blue-600 hover:underline"
        >
            Back to Login
        </a>
    </div>
</main>

<script>
    const form = document.getElementById('reset-form');
    const button = document.getElementById('submit-btn');
    const message = document.getElementById('message');

    const passwordInput = document.getElementById('new-password');
    const confirmInput = document.getElementById('confirm-password');

    // Read the reset token from the URL.
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    function showMessage(text, type) {
        message.textContent = text;

        message.className = 'rounded-lg p-3 text-sm';

        if (type === 'success') {
            message.classList.add('bg-green-50', 'text-green-700');
        } else {
            message.classList.add('bg-red-50', 'text-red-700');
        }
    }

    // A reset link must contain a token.
    if (!token) {
        showMessage(
            'Reset token is missing. Please request a new reset link.',
            'error',
        );

        button.disabled = true;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!token) {
            return;
        }

        const newPassword = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (newPassword.length < 8) {
            showMessage('Password must contain at least 8 characters.', 'error');
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage('Passwords do not match.', 'error');
            return;
        }

        button.disabled = true;
        button.textContent = 'Updating Password...';
        message.classList.add('hidden');

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Accept: 'application/json',
                },
                body: JSON.stringify({
                    token: token,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword,
                }),
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(result.message || 'Unable to reset password.');
            }

            showMessage(
                result.message || 'Password reset successful. Please log in.',
                'success',
            );

            form.reset();
            button.textContent = 'Password Updated';

            // Remove the sensitive token from the visible URL.
            window.history.replaceState(
                {},
                document.title,
                '/auth/reset-password',
            );

            // Return to login after a short delay.
            setTimeout(() => {
                window.location.assign('/auth/login');
            }, 2000);
        } catch (error) {
            showMessage(
                error instanceof TypeError
                    ? 'Unable to connect to the server. Please try again.'
                    : error.message,
                'error',
            );

            button.disabled = false;
            button.textContent = 'Update Password';
        }
    });
</script>
</body>
</html>
