<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><link rel="icon" type="image/png" href="/EMSlogo.png"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Examinations | EMS</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-50 text-slate-800"><main class="mx-auto max-w-7xl p-5 sm:p-8">
<header class="mb-8"><p class="text-sm text-slate-500">Administration / Examinations</p><h1 class="mt-1 text-3xl font-bold">All Examinations</h1></header>
<div id="message" class="mb-4 hidden rounded-lg p-4 text-sm"></div>
<section class="overflow-x-auto rounded-2xl border bg-white"><table class="w-full min-w-[800px] text-left text-sm"><thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="p-4">Exam</th><th class="p-4">Subject</th><th class="p-4">Schedule</th><th class="p-4">Status</th><th class="p-4">Actions</th></tr></thead><tbody id="rows" class="divide-y"></tbody></table></section>
</main><script>
(()=>{const token=localStorage.getItem('token');let user;try{user=JSON.parse(localStorage.getItem('ems_current_user')||'null')}catch{user=null}
if(!token||!user||user.role!=='ADMIN'){location.replace('/auth/login');return}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
async function load(){const r=await fetch('/api/admin/exams',{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});if(r.status===401){location.replace('/auth/login');return}if(!r.ok)throw Error('Unable to load examinations.');const exams=await r.json();document.getElementById('rows').innerHTML=exams.map(e=>`<tr><td class="p-4 font-semibold">${esc(e.title)}</td><td class="p-4">${esc(e.subject||'General')}</td><td class="p-4">${e.startTime?esc(new Date(e.startTime).toLocaleString()):'Not scheduled'}</td><td class="p-4">${esc(e.status)}</td><td class="p-4"><select data-status="${e.id}" class="rounded border px-2 py-1"><option value="DRAFT">Draft</option><option value="PUBLISHED">Published</option><option value="CLOSED">Closed</option></select><button data-delete="${e.id}" class="ml-3 text-red-700">Delete</button></td></tr>`).join('');exams.forEach(e=>{const s=document.querySelector(`[data-status="${e.id}"]`);if(s)s.value=e.status})}
document.getElementById('rows').addEventListener('change',async e=>{if(!e.target.dataset.status)return;const r=await fetch(`/api/admin/exams/${e.target.dataset.status}/status`,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(e.target.value)});if(!r.ok){alert('Unable to update exam status.');load()}});
document.getElementById('rows').addEventListener('click',async e=>{const b=e.target.closest('[data-delete]');if(!b||!confirm('Delete this examination?'))return;const r=await fetch(`/api/admin/exams/${b.dataset.delete}`,{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(!r.ok)alert('Unable to delete examination.');else load()});load().catch(e=>{document.getElementById('message').textContent=e.message;document.getElementById('message').classList.remove('hidden')})})();
</script><script src="/js/ems-navbar.js"></script></body></html>
