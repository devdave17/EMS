<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/EMSlogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Timetable | EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<main class="mx-auto max-w-6xl p-5 sm:p-8">
    <header class="mb-8">
        <p class="text-sm text-slate-500">Student Portal / Timetable</p>
        <h1 class="mt-1 text-3xl font-bold">Exam Timetable</h1>
        <p class="mt-2 text-sm text-slate-500">
            Your upcoming and currently live published examinations.
        </p>
    </header>

    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white">
        <div id="loading" class="p-8 text-center text-sm text-slate-500">
            Loading timetable...
        </div>
        <div id="error" class="hidden p-8 text-center text-sm text-red-600"></div>
        <div id="empty" class="hidden p-8 text-center text-sm text-slate-500">
            No upcoming or live examinations scheduled.
        </div>
        <div id="table-wrapper" class="hidden overflow-x-auto">
            <table class="w-full min-w-[640px] text-left text-sm">
                <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                <tr>
                    <th class="px-5 py-4 font-semibold">Examination</th>
                    <th class="px-5 py-4 font-semibold">Subject</th>
                    <th class="px-5 py-4 font-semibold">Date</th>
                    <th class="px-5 py-4 font-semibold">Time</th>
                    <th class="px-5 py-4 font-semibold">Status</th>
                    <th class="px-5 py-4 font-semibold">Duration</th>
                </tr>
                </thead>
                <tbody id="timetable" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    (() => {
        const token = localStorage.getItem('token');
        let user;
        try {
            user = JSON.parse(localStorage.getItem('ems_current_user') || 'null');
        } catch {
            user = null;
        }

        if (!token || !user || user.role !== 'STUDENT') {
            window.location.replace('/auth/login');
            return;
        }

        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[character]);

        const formatDate = value => new Date(value).toLocaleDateString(undefined, {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        });

        const formatTime = value => new Date(value).toLocaleTimeString(undefined, {
            hour: '2-digit',
            minute: '2-digit'
        });

        async function loadTimetable() {
            try {
                const response = await fetch('/api/student/exams/timetable', {
                    headers: {
                        Authorization: `Bearer ${token}`,
                        Accept: 'application/json'
                    }
                });
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('ems_current_user');
                    window.location.replace('/auth/login');
                    return;
                }
                if (!response.ok) {
                    throw new Error(`Unable to load timetable (HTTP ${response.status}).`);
                }

                const exams = await response.json();
                document.getElementById('loading').classList.add('hidden');

                if (!exams.length) {
                    document.getElementById('empty').classList.remove('hidden');
                    return;
                }

                const now = new Date();
                document.getElementById('timetable').innerHTML = exams.map(exam => {
                    const isLive = now >= new Date(exam.startTime)
                        && now < new Date(exam.endTime);
                    const statusClass = isLive
                        ? 'bg-emerald-50 text-emerald-700'
                        : 'bg-amber-50 text-amber-700';
                    const statusLabel = isLive ? 'Live' : 'Upcoming';
                    return `
                    <tr>
                        <td class="px-5 py-5 font-semibold">${escapeHtml(exam.title)}</td>
                        <td class="px-5 py-5 text-slate-600">${escapeHtml(exam.subject || 'General')}</td>
                        <td class="whitespace-nowrap px-5 py-5 text-slate-600">${formatDate(exam.startTime)}</td>
                        <td class="whitespace-nowrap px-5 py-5 text-slate-600">${formatTime(exam.startTime)}</td>
                        <td class="px-5 py-5">
                            <span class="rounded-full px-3 py-1 text-xs font-semibold ${statusClass}">
                                ${statusLabel}
                            </span>
                        </td>
                        <td class="whitespace-nowrap px-5 py-5 text-slate-600">${escapeHtml(exam.durationMinutes)} minutes</td>
                    </tr>
                `;
                }).join('');
                document.getElementById('table-wrapper').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                const errorBox = document.getElementById('error');
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
            }
        }

        loadTimetable();
    })();
</script>
<script src="/js/ems-navbar.js"></script>
</body>
</html>
