<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

<main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
    <h1 class="text-2xl font-bold text-slate-900">Forgot password?</h1>
    <p class="mt-2 text-sm text-slate-600">
        Enter your registered email to request a password reset.
    </p>

    <form id="forgot-form" class="mt-6 space-y-4">
        <div>
            <label for="email" class="mb-1 block text-sm font-medium">
                Email address
            </label>
            <input id="email" name="email" type="email"
                   required autocomplete="email"
                   class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500">
        </div>

        <p id="message" class="hidden rounded-lg p-3 text-sm"
           role="status" aria-live="polite"></p>

        <button id="submit-button" type="submit"
                class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700 disabled:opacity-60">
            Send reset link
        </button>
    </form>

    <a href="/auth/login"
       class="mt-6 block text-center text-sm text-indigo-600 hover:underline">
        Back to login
    </a>
</main>

<script>
    const form = document.getElementById("forgot-form");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("submit-button");
    const message = document.getElementById("message");

    function showMessage(text, success) {
        message.textContent = text;
        message.className = "rounded-lg p-3 text-sm " +
            (success
                ? "bg-green-50 text-green-700"
                : "bg-red-50 text-red-700");
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.classList.add("hidden");
        button.disabled = true;
        button.textContent = "Sending...";

        try {
            const response = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    email: emailInput.value.trim()
                })
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    result.message || "Unable to process your request."
                );
            }

            showMessage(
                result.message || "If an account exists for that email, a reset link will be sent.",
                true
            );
        } catch (error) {
            showMessage(
                error instanceof TypeError
                    ? "Unable to connect to the server. Please try again."
                    : error.message,
                false
            );
        } finally {
            message.classList.remove("hidden");
            button.disabled = false;
            button.textContent = "Send reset link";
        }
    });
</script>
</body>
</html>
