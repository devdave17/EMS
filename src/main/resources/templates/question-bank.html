
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Banks | EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<main class="mx-auto max-w-6xl p-5 sm:p-8">
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <div>
            <a href="/auth/teacher/dashboard" class="text-sm text-emerald-700">← Dashboard</a>
            <h1 class="mt-3 text-3xl font-bold">Question Banks</h1>
            <p class="mt-2 text-sm text-slate-500">Manage your reusable questions.</p>
        </div>
        <a href="/auth/teacher/questions/new"
           class="rounded-xl bg-emerald-700 px-5 py-3 font-semibold text-white hover:bg-emerald-800">
            + Create New Bank
        </a>
    </header>

    <div id="message" class="mb-4 text-sm" role="status"></div>

    <section id="banks" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <p class="text-slate-500">Loading question banks...</p>
    </section>
</main>

<script>
    const token = localStorage.getItem("token");
    const user = JSON.parse(localStorage.getItem("ems_current_user") || "null");

    if (!token || !user || user.role !== "TEACHER") {
        localStorage.removeItem("token");
        localStorage.removeItem("ems_current_user");
        window.location.replace("/auth/login");
    }

    async function api(url) {
        const response = await fetch(url, {
            headers: { Authorization: `Bearer ${token}` }
        });

        if (response.status === 401) {
            localStorage.removeItem("token");
            localStorage.removeItem("ems_current_user");
            window.location.replace("/auth/login");
            throw new Error("Please log in again.");
        }

        if (!response.ok) {
            throw new Error(await response.text() || `Request failed (${response.status})`);
        }

        return response.status === 204 ? null : response.json();
    }

    function showMessage(text) {
        document.getElementById("message").textContent = text;
    }

    async function loadBanks() {
        const container = document.getElementById("banks");

        try {
            const banks = await api("/api/question-banks");
            container.replaceChildren();

            if (!banks.length) {
                container.innerHTML = `
                <div class="col-span-full rounded-2xl border border-dashed bg-white p-10 text-center">
                    <h2 class="text-xl font-semibold">No question banks yet</h2>
                    <p class="mt-2 text-sm text-slate-500">Create your first bank to get started.</p>
                    <a href="/auth/teacher/questions/new"
                       class="mt-5 inline-block rounded-lg bg-emerald-700 px-4 py-2 text-white">
                       Create Bank
                    </a>
                </div>`;
                return;
            }

            const cards = await Promise.all(banks.map(async bank => {
                let count = "—";
                try {
                    const questions = await api(
                        `/api/question-banks/${encodeURIComponent(bank.id)}/questions`
                    );
                    count = questions.length;
                } catch (error) {
                    console.error("Could not load question count", error);
                }

                return `
                <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                    <div class="mb-4 flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-50 text-xl">☷</div>
                    <h2 class="break-words text-lg font-bold">${escapeHtml(bank.name)}</h2>

                    <p class="mt-1 text-sm text-emerald-700">${escapeHtml(bank.subject)}</p>
                    <p class="mt-3 min-h-10 text-sm text-slate-500">${escapeHtml(bank.description || "No description provided.")}</p>
                    <p class="mt-4 text-sm text-slate-600">${count} question(s)</p>
                    <p class="mt-1 text-xs text-slate-400">Created: ${bank.createdAt ? new Date(bank.createdAt).toLocaleDateString() : "—"}</p>
                    <a href="/auth/teacher/questions/new?bankId=${encodeURIComponent(bank.id)}"
                       class="mt-5 inline-block rounded-lg border border-emerald-700 px-4 py-2 text-sm font-semibold text-emerald-700 hover:bg-emerald-50">
                       Add Questions
                    </a>
                    <a href="/auth/teacher/questions/${encodeURIComponent(bank.id)}"
   class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
    Open Bank
</a>
                </article>`;
            }));

            container.innerHTML = cards.join("");
        } catch (error) {
            showMessage(error.message);
            container.innerHTML = `
            <p class="col-span-full rounded-xl bg-red-50 p-4 text-red-700">
                Unable to load question banks. Check the backend logs and login token.
            </p>`;
        }
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;",
            '"': "&quot;", "'": "&#39;"
        })[char]);
    }

    loadBanks();
</script>
</body>
</html>
