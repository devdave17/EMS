
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Question Bank | EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

<header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
        <div>
            <p class="text-sm text-slate-500">EMS / Teacher / Question Banks</p>
            <h1 class="text-xl font-bold mt-1">Manage Question Bank</h1>
        </div>
        <a href="/auth/teacher/questions"
           class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">
            ← All Banks
        </a>
    </div>
</header>

<main class="max-w-6xl mx-auto px-5 py-8">

    <div id="message" class="hidden mb-5 rounded-lg p-4 text-sm" role="status"></div>

    <section class="bg-white rounded-2xl border border-slate-200 p-6 mb-7">
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
            <div>
                <p class="text-sm text-indigo-600 font-semibold">QUESTION BANK</p>
                <h2 id="bankName" class="text-2xl font-bold mt-2">Loading...</h2>
                <p id="bankSubject" class="text-sm text-slate-600 mt-2"></p>
                <p id="bankDescription" class="text-slate-500 mt-2"></p>
            </div>
            <div class="bg-indigo-50 rounded-xl px-5 py-4 min-w-28">
                <p class="text-sm text-indigo-700">Total Questions</p>
                <p id="questionCount" class="text-3xl font-bold text-indigo-900">0</p>
            </div>
        </div>
    </section>

    <section id="editor" class="hidden bg-white rounded-2xl border border-slate-200 p-6 mb-7">
        <div class="flex justify-between items-center gap-3 mb-5">
            <h2 id="formTitle" class="text-xl font-bold">Add Question</h2>
            <button type="button" onclick="resetForm()"
                    class="text-sm text-slate-500 hover:text-slate-900">
                Cancel
            </button>
        </div>

        <form id="questionForm" class="space-y-5">
            <div>
                <label for="questionText" class="block text-sm font-semibold mb-2">
                    Question <span class="text-red-500">*</span>
                </label>
                <textarea id="questionText" required maxlength="2000" rows="3"
                          class="w-full rounded-lg border border-slate-300 p-3 focus:ring-2 focus:ring-indigo-500 outline-none"
                          placeholder="Enter your question"></textarea>
            </div>

            <div>
                <div class="flex items-center justify-between gap-3 mb-3">
                    <label class="text-sm font-semibold">Answer Options (2–6)</label>
                    <button type="button" onclick="addOption()"
                            class="text-sm font-semibold text-indigo-600 hover:text-indigo-800">
                        + Add Option
                    </button>
                </div>
                <div id="optionsContainer" class="space-y-3"></div>
                <p class="text-xs text-slate-500 mt-2">
                    Select the radio button next to the correct answer.
                </p>
            </div>

            <div class="max-w-xs">
                <label for="points" class="block text-sm font-semibold mb-2">
                    Marks / Points
                </label>
                <input id="points" type="number" min="0.1" step="any" value="1" required
                       class="w-full rounded-lg border border-slate-300 p-3 outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex flex-wrap gap-3">
                <button id="saveButton" type="submit"
                        class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700 disabled:opacity-60">
                    Save Question
                </button>
                <button type="button" onclick="resetForm()"
                        class="rounded-lg border border-slate-300 px-5 py-3 font-semibold hover:bg-slate-100">
                    Cancel
                </button>
            </div>
        </form>
    </section>

    <section>
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
            <div>
                <h2 class="text-xl font-bold">Questions</h2>
                <p class="text-sm text-slate-500 mt-1">Edit or remove individual questions.</p>
            </div>
            <button id="addQuestionButton" type="button" onclick="startAdd()"
                    class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700">
                + Add Question
            </button>
        </div>

        <div id="questionsList" class="space-y-4">
            <div class="bg-white rounded-xl border border-slate-200 p-6 text-slate-500">
                Loading questions...
            </div>
        </div>
    </section>
</main>

<script>
    const token = localStorage.getItem("token");
    const currentUser = JSON.parse(
        localStorage.getItem("ems_current_user") || "null"
    );

    if (!token || !currentUser || currentUser.role !== "TEACHER") {
        localStorage.removeItem("token");
        localStorage.removeItem("ems_current_user");
        window.location.replace("/auth/login");
    }

    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const bankId = decodeURIComponent(pathParts[pathParts.length - 1]);

    let bank = null;
    let questions = [];
    let editingQuestionId = null;
    let saving = false;

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[ch]);
    }

    function showMessage(text, type = "success") {
        const el = $("message");
        el.textContent = text;
        el.className = "mb-5 rounded-lg p-4 text-sm " +
            (type === "error"
                ? "bg-red-50 text-red-700 border border-red-200"
                : "bg-green-50 text-green-700 border border-green-200");

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function hideMessage() {
        $("message").className = "hidden mb-5 rounded-lg p-4 text-sm";
        $("message").textContent = "";
    }

    async function api(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Authorization": "Bearer " + token,
                ...(options.body ? { "Content-Type": "application/json" } : {}),
                ...(options.headers || {})
            }
        });

        if (response.status === 401) {
            localStorage.removeItem("token");
            localStorage.removeItem("ems_current_user");
            window.location.replace("/auth/login");
            throw new Error("Session expired. Please log in again.");
        }

        if (!response.ok) {
            const text = await response.text();
            let message = text || `Request failed (${response.status})`;

            try {
                const data = JSON.parse(text);
                message = data.detail || data.message ||
                    (data.errors ? data.errors.map(e => e.message).join(", ") : message);
            } catch (_) {}

            throw new Error(message);
        }

        if (response.status === 204) return null;

        const text = await response.text();
        return text ? JSON.parse(text) : null;
    }

    async function loadPage() {
        try {
            const results = await Promise.all([
                api(`/api/question-banks/${encodeURIComponent(bankId)}`),
                api(`/api/question-banks/${encodeURIComponent(bankId)}/questions`)
            ]);

            bank = results[0];
            questions = results[1] || [];

            $("bankName").textContent = bank.name || "Untitled Bank";
            $("bankSubject").textContent = "Subject: " + (bank.subject || "—");
            $("bankDescription").textContent = bank.description || "No description provided.";
            renderQuestions();
        } catch (error) {
            showMessage("Could not load the question bank: " + error.message, "error");
            $("questionsList").innerHTML =
                '<div class="rounded-xl bg-white border border-slate-200 p-6">Unable to load questions.</div>';
        }
    }

    function renderQuestions() {
        $("questionCount").textContent = questions.length;

        if (!questions.length) {
            $("questionsList").innerHTML = `
            <div class="bg-white rounded-xl border border-dashed border-slate-300 p-10 text-center">
                <h3 class="font-bold text-lg">No questions yet</h3>
                <p class="text-slate-500 mt-2">Add your first question to this bank.</p>
                <button onclick="startAdd()"
                    class="mt-5 rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700">
                    + Add First Question
                </button>
            </div>`;
            return;
        }

        $("questionsList").innerHTML = questions.map((q, index) => {
            const options = Array.isArray(q.options) ? q.options : [];

            return `
        <article class="bg-white rounded-xl border border-slate-200 p-5 sm:p-6">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                <div class="flex-1 min-w-0">
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <span class="rounded-md bg-indigo-50 text-indigo-700 px-2.5 py-1 text-xs font-bold">
                            Question ${index + 1}
                        </span>
                        <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-semibold">
                            ${escapeHtml(q.points)} marks
                        </span>
                    </div>

                    <p class="font-semibold whitespace-pre-wrap break-words">${escapeHtml(q.questionText)}</p>

                    <div class="mt-4 space-y-2">
                        ${options.map((option, i) => `
                            <div class="flex items-start gap-2 text-sm ${
                i === q.correctOptionIndex
                    ? "text-green-700 font-semibold"
                    : "text-slate-600"
            }">
                                <span class="shrink-0">${String.fromCharCode(65 + i)}.</span>
                                <span class="whitespace-pre-wrap break-words">${escapeHtml(option)}</span>
                                ${i === q.correctOptionIndex
                ? '<span class="shrink-0 text-xs">(Correct answer)</span>'
                : ""}
                            </div>
                        `).join("")}
                    </div>
                </div>

                <div class="flex sm:flex-col gap-2 shrink-0">
                    <button type="button"
                        onclick="startEdit('${escapeHtml(q.id)}')"
                        class="rounded-lg border border-indigo-200 text-indigo-700 px-4 py-2 text-sm font-semibold hover:bg-indigo-50">
                        Edit
                    </button>
                    <button type="button"
                        onclick="deleteQuestion('${escapeHtml(q.id)}')"
                        class="rounded-lg border border-red-200 text-red-600 px-4 py-2 text-sm font-semibold hover:bg-red-50">
                        Delete
                    </button>
                </div>
            </div>
        </article>`;
        }).join("");
    }

    function makeOption(value = "", checked = false) {
        const row = document.createElement("div");
        row.className = "option-row flex items-center gap-3";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "correctOption";
        radio.className = "h-4 w-4 accent-indigo-600 shrink-0";
        radio.checked = checked;
        radio.setAttribute("aria-label", "Mark as correct answer");

        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 500;
        input.required = true;
        input.value = value;
        input.placeholder = "Enter answer option";
        input.className = "option-input min-w-0 flex-1 rounded-lg border border-slate-300 p-3 outline-none focus:ring-2 focus:ring-indigo-500";

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.className = "text-sm text-red-600 hover:text-red-800";
        remove.onclick = () => {
            if (document.querySelectorAll(".option-row").length <= 2) {
                showMessage("A question must have at least 2 options.", "error");
                return;
            }
            row.remove();
            hideMessage();
        };

        row.append(radio, input, remove);
        $("optionsContainer").appendChild(row);
    }

    function addOption(value = "") {
        if ($("optionsContainer").children.length >= 6) {
            showMessage("You can add a maximum of 6 options.", "error");
            return;
        }
        makeOption(value);
    }

    function startAdd() {
        hideMessage();
        editingQuestionId = null;
        $("questionForm").reset();
        $("optionsContainer").replaceChildren();

        for (let i = 0; i < 4; i++) makeOption("", i === 0);

        $("points").value = "1";
        $("formTitle").textContent = "Add Question";
        $("saveButton").textContent = "Save Question";
        $("editor").classList.remove("hidden");
        $("editor").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function startEdit(questionId) {
        hideMessage();

        const q = questions.find(item => item.id === questionId);
        if (!q) {
            showMessage("Question not found. Refresh the page and try again.", "error");
            return;
        }

        editingQuestionId = questionId;
        $("questionText").value = q.questionText || "";
        $("points").value = q.points ?? 1;
        $("optionsContainer").replaceChildren();

        (q.options || []).forEach((option, index) => {
            makeOption(option, index === q.correctOptionIndex);
        });

        $("formTitle").textContent = "Edit Question";
        $("saveButton").textContent = "Update Question";
        $("editor").classList.remove("hidden");
        $("editor").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function resetForm() {
        editingQuestionId = null;
        $("questionForm").reset();
        $("optionsContainer").replaceChildren();
        $("editor").classList.add("hidden");
        hideMessage();
    }

    $("questionForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (saving) return;

        hideMessage();

        const questionText = $("questionText").value.trim();
        const optionRows = [...document.querySelectorAll(".option-row")];
        const options = optionRows.map(row => row.querySelector(".option-input").value.trim());
        const correctOptionIndex = optionRows.findIndex(row =>
            row.querySelector('input[type="radio"]').checked
        );
        const points = Number($("points").value);

        if (!questionText) {
            showMessage("Question text is required.", "error");
            return;
        }

        if (options.length < 2 || options.length > 6 || options.some(option => !option)) {
            showMessage("Enter between 2 and 6 non-empty options.", "error");
            return;
        }

        if (correctOptionIndex < 0) {
            showMessage("Select the correct answer.", "error");
            return;
        }

        if (!Number.isFinite(points) || points <= 0) {
            showMessage("Marks must be greater than zero.", "error");
            return;
        }

        // subject is required by the existing QuestionBankQuestion validation.
        const payload = {
            subject: bank.subject,
            questionText,
            options,
            correctOptionIndex,
            points
        };

        saving = true;
        $("saveButton").disabled = true;
        $("saveButton").textContent = "Saving...";

        try {
            if (editingQuestionId) {
                await api(
                    `/api/question-banks/${encodeURIComponent(bankId)}/questions/${encodeURIComponent(editingQuestionId)}`,
                    { method: "PUT", body: JSON.stringify(payload) }
                );
                showMessage("Question updated successfully.");
            } else {
                await api(
                    `/api/question-banks/${encodeURIComponent(bankId)}/questions`,
                    { method: "POST", body: JSON.stringify(payload) }
                );
                showMessage("Question added successfully.");
            }

            resetForm();
            await loadPage();
        } catch (error) {
            showMessage("Could not save question: " + error.message, "error");
        } finally {
            saving = false;
            $("saveButton").disabled = false;
            $("saveButton").textContent = editingQuestionId
                ? "Update Question"
                : "Save Question";
        }
    });

    async function deleteQuestion(questionId) {
        const q = questions.find(item => item.id === questionId);
        if (!q) return;

        if (!confirm("Delete this question permanently? This action cannot be undone.")) {
            return;
        }

        hideMessage();

        try {
            await api(
                `/api/question-banks/${encodeURIComponent(bankId)}/questions/${encodeURIComponent(questionId)}`,
                { method: "DELETE" }
            );

            if (editingQuestionId === questionId) resetForm();

            questions = questions.filter(item => item.id !== questionId);
            renderQuestions();
            showMessage("Question deleted successfully.");
        } catch (error) {
            showMessage("Could not delete question: " + error.message, "error");
        }
    }

    loadPage();
</script>

</body>
</html>
