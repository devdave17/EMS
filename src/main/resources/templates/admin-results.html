<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><link rel="icon" type="image/png" href="/EMSlogo.png"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Results | EMS</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-50 text-slate-800"><main class="mx-auto max-w-7xl p-5 sm:p-8"><header class="mb-8"><p class="text-sm text-slate-500">Administration / Results</p><h1 class="mt-1 text-3xl font-bold">All Results</h1></header><div id="message" class="mb-4 hidden rounded-lg p-4 text-sm"></div><section id="results" class="space-y-5"></section></main>
<script>
(()=>{const token=localStorage.getItem('token');let user;try{user=JSON.parse(localStorage.getItem('ems_current_user')||'null')}catch{user=null}if(!token||!user||user.role!=='ADMIN'){location.replace('/auth/login');return}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);async function load(){const r=await fetch('/api/admin/results',{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});if(!r.ok)throw Error('Unable to load results.');const data=await r.json();document.getElementById('results').innerHTML=data.map(e=>`<article class="overflow-hidden rounded-2xl border bg-white"><header class="flex flex-wrap items-center justify-between gap-3 border-b p-5"><div><p class="text-xs uppercase text-indigo-600">${esc(e.subject||'General')}</p><h2 class="text-lg font-bold">${esc(e.title)}</h2><p class="text-xs text-slate-500">${e.submissions.length} submission(s)</p></div>${e.canPublish?`<button data-publish="${e.quizId}" class="rounded bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">Publish results</button>`:`<span class="rounded-full bg-emerald-50 text-emerald-700">${e.resultsPublished?'Published':'Not ready'}</span>`}</header><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="p-4">Student</th><th class="p-4">Status</th><th class="p-4">Score</th><th class="p-4">Submitted</th></tr></thead><tbody class="divide-y">${e.submissions.map(s=>`<tr><td class="p-4">${esc(s.studentId)}</td><td class="p-4">${esc(s.status)}</td><td class="p-4">${esc(s.score??0)} / ${esc(s.totalMarks??0)}</td><td class="p-4">${s.submittedAt?esc(new Date(s.submittedAt).toLocaleString()):'In progress'}</td></tr>`).join('')||'<tr><td colspan="4" class="p-6 text-center text-slate-500">No submissions.</td></tr>'}</tbody></table></div></article>`).join('')||'<p class="rounded border bg-white p-8 text-center text-slate-500">No results.</p>';};
document.getElementById('results').addEventListener('click',async e=>{const b=e.target.closest('[data-publish]');if(!b)return;const r=await fetch(`/api/admin/results/${b.dataset.publish}/publish`,{method:'POST',headers:{Authorization:'Bearer '+token}});if(!r.ok)alert('Unable to publish results.');else load()});load().catch(e=>{const m=document.getElementById('message');m.textContent=e.message;m.classList.remove('hidden')});})();
</script><script src="/js/ems-navbar.js"></script></body></html>
