<header class="app-topbar">

    <!-- =================================
         Topbar Left
         ================================= -->

    <div class="topbar-left">

        <!-- Mobile Menu Button -->

        <button
            type="button"
            class="mobile-menu-button"
            id="mobile-menu-button"
            aria-label="Open navigation menu"
            aria-controls="app-sidebar"
            aria-expanded="false"
        >
            <span aria-hidden="true">☰</span>
        </button>


        <!-- Page Context -->

        <div class="topbar-page-context">

            <div
                class="topbar-page-title"
                id="topbar-page-title"
            >
                Dashboard
            </div>

        </div>

    </div>


    <!-- =================================
         Topbar Right
         ================================= -->

    <div class="topbar-right">

        <!-- Notifications -->

        <button
            type="button"
            class="icon-button"
            id="notification-button"
            aria-label="Notifications"
            title="Notifications"
        >
            <span aria-hidden="true">🔔</span>
        </button>


        <!-- User Profile -->

        <button
            type="button"
            class="topbar-user"
            id="topbar-user"
            aria-label="Open user menu"
            aria-expanded="false"
            aria-haspopup="menu"
        >

            <span
                class="topbar-user__avatar"
                id="topbar-user-avatar"
                aria-hidden="true"
            >
                U
            </span>

            <span class="topbar-user__info">

                <span
                    class="topbar-user__name"
                    id="topbar-user-name"
                >
                    User
                </span>

                <span
                    class="topbar-user__role"
                    id="topbar-user-role"
                >
                    Student
                </span>

            </span>

            <span
                class="topbar-user__arrow"
                aria-hidden="true"
            >
                ▾
            </span>

        </button>

    </div>

</header>
